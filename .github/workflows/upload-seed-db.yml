name: Upload Seed DB

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload seed DB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tennis-seed-db
          path: astrology/scrapers/oddsportal/data/raw/tennis_history.db
          retention-days: 365
